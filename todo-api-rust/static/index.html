<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Todo List</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#f97316; --danger:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; justify-content:center; padding:40px 16px; }
  main { width:100%; max-width:560px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
                     background:var(--card); color:var(--text); font-size:16px; }
  input[type=text]:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { cursor:pointer; border:0; border-radius:10px; font-size:15px; }
  .add { padding:0 20px; background:var(--accent); color:#111; font-weight:600; }
  .add:hover { filter:brightness(1.1); }
  #error { min-height:20px; color:var(--danger); font-size:14px; margin-bottom:8px; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
       border-radius:10px; padding:12px 14px; }
  li input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); cursor:pointer; }
  .title { flex:1; word-break:break-word; }
  li.done .title { text-decoration:line-through; color:var(--muted); }
  .icon { background:transparent; color:var(--muted); padding:6px 8px; }
  .icon:hover { color:var(--text); background:var(--line); }
  .icon.del:hover { color:var(--danger); }
  .edit { flex:1; padding:6px 8px; font-size:16px; border-radius:6px; border:1px solid var(--accent);
          background:var(--bg); color:var(--text); }
  .empty { text-align:center; color:var(--muted); padding:24px; }
  .count { color:var(--muted); font-size:13px; margin-top:12px; text-align:right; }
</style>
</head>
<body>
<main>
  <h1>Todo List</h1>
  <p class="sub">Rust + Axum + PostgreSQL, running in Docker</p>

  <form id="form">
    <input type="text" id="title" placeholder="What needs doing?" autocomplete="off" maxlength="200">
    <button class="add" type="submit">Add</button>
  </form>
  <div id="error" role="alert"></div>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</main>

<script>
  // Relative path (no leading slash) so this also works behind Nginx at /rust-todos/.
  const API = 'todos';
  const list = document.getElementById('list');
  const errorBox = document.getElementById('error');

  function showError(msg) { errorBox.textContent = msg || ''; }

  async function api(path, options) {
    const res = await fetch(path, options);
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong (' + res.status + ')');
    return data;
  }

  function render(todos) {
    list.innerHTML = '';
    if (todos.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing here yet. Add your first todo above.';
      list.appendChild(empty);
    }
    for (const t of todos) list.appendChild(row(t));
    const done = todos.filter(t => t.completed).length;
    document.getElementById('count').textContent = todos.length ? done + ' of ' + todos.length + ' done' : '';
  }

  function row(t) {
    const li = document.createElement('li');
    if (t.completed) li.className = 'done';

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = t.completed;
    box.onchange = () => act(() => api(API + '/' + t.id, json('PUT', { completed: box.checked })));

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = t.title;   // textContent, never innerHTML, so input cannot inject HTML

    const edit = document.createElement('button');
    edit.className = 'icon';
    edit.title = 'Edit';
    edit.textContent = '✎';
    edit.onclick = () => startEdit(li, t, title, edit);

    const del = document.createElement('button');
    del.className = 'icon del';
    del.title = 'Delete';
    del.textContent = '✕';
    del.onclick = () => act(() => api(API + '/' + t.id, { method: 'DELETE' }));

    li.append(box, title, edit, del);
    return li;
  }

  function startEdit(li, t, title, editBtn) {
    const input = document.createElement('input');
    input.className = 'edit';
    input.value = t.title;
    li.replaceChild(input, title);
    editBtn.style.display = 'none';
    input.focus();
    const save = () => {
      const value = input.value.trim();
      if (value && value !== t.title) act(() => api(API + '/' + t.id, json('PUT', { title: value })));
      else load();
    };
    input.onkeydown = e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') load(); };
    input.onblur = save;
  }

  const json = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  async function act(fn) {
    try { showError(''); await fn(); await load(); }
    catch (e) { showError(e.message); await load().catch(() => {}); }
  }

  async function load() {
    try { render(await api(API)); }
    catch (e) { showError('Could not load todos: ' + e.message); }
  }

  document.getElementById('form').onsubmit = async e => {
    e.preventDefault();
    const input = document.getElementById('title');
    await act(() => api(API, json('POST', { title: input.value })));
    if (!errorBox.textContent) input.value = '';
    input.focus();
  };

  load();
</script>
</body>
</html>
